name: Unzip deploy.zip
on:
  push:
    paths:
      - 'deploy.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repo root
        run: |
          if [ ! -f deploy.zip ]; then echo "no deploy.zip, nothing to do"; exit 0; fi
          unzip -o deploy.zip -d .
          rm deploy.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-extract deploy.zip" || echo "nothing to commit"
          git push
