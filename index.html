<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>math 3</title>
<script>
  try {
    var t = localStorage.getItem("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/math3.css">
</head>
<body>
<script src="assets/ios-compat.js"></script>
<button id="links-fab" class="links-fab" hidden>🔗</button>
<div id="links-panel" class="links-panel" hidden></div>
<div class="wrap">
  <header>
    <div>
      <p class="label">BATCH BOARD</p>
      <h1>math 3</h1>
    </div>
    <div class="row">
      <button id="courses-btn" class="small" hidden>موادّي</button>
      <button id="manage-btn" class="small" hidden>إدارة المواد</button>
      <button id="sections-btn" class="small" hidden>الأقسام</button>
      <button id="theme-btn" class="small" hidden>المظهر</button>
      <button id="people-btn" class="small" hidden>users</button>
      <button id="log-btn" class="small" hidden>السجل</button>
      <button id="backup-btn" class="small" hidden>نسخة احتياطية</button>
      <button id="logout" class="small" hidden>خروج</button>
    </div>
  </header>
  <div id="loading" class="card center">
    <p>جاري التحميل...</p>
  </div>
  <div id="login-box" class="card center" hidden>
    <div id="saved-accounts"></div>
    <div id="tg-widget-wrap">
      <p id="login-label" hidden></p>
      <div id="tg-slot"></div>
      <script>
        if (!window.IS_IOS) {
          document.write('<script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="MATHDEPARTMENT_BOT" data-size="large" data-onauth="onTelegramAuth(user)" data-request-access="write"><\/script>');
        }
      </script>
    </div>
    <div class="login-divider" style="margin: 16px 0 12px; display: flex; align-items: center; justify-content: center; gap: 10px; opacity: 0.6; font-size: 13px; font-weight: 600; text-transform: uppercase;">
      <span style="flex: 1; height: 1px; background: var(--line);"></span>
      <span>or</span>
      <span style="flex: 1; height: 1px; background: var(--line);"></span>
    </div>
    <button id="anon-login-btn" type="button" class="btn" style="width: 100%; padding: 10px 16px; border-radius: 8px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-weight: bold; font-size: 14px; cursor: pointer;">
      Log in anonymous
    </button>
  </div>
  <div id="pending-box" class="card center" hidden>
    <p id="welcome"></p>
    <p class="label" style="text-align:center">STATUS: SUSPENDED</p>
    <p>الحساب غير مفعّل حاليًا. للاستفسار، برجاء التواصل مع المسؤولين.</p>
  </div>
  <div id="picker-box" class="card" hidden></div>
  <div id="courses-box" hidden></div>
  <div id="people-box" hidden></div>
  <div id="log-box" hidden></div>
  <div id="theme-box" hidden></div>
  <div id="app" hidden>
    <div id="anon-banner" class="card" hidden style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding:10px 14px; margin-bottom:12px; border:1px solid var(--line); background:var(--card);">
      <div style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:bold;">
        <span>👤</span>
        <span>Logged in as anonymous</span>
      </div>
      <button id="switch-to-telegram-btn" class="small btn-primary" type="button" style="padding:6px 14px !important;">
        📱 تسجيل الدخول بتيليجرام (Login with Telegram)
      </button>
    </div>
    <p id="hello" class="label"></p>
    <div id="bot-banner" class="card" hidden></div>
    <div id="dashboard" hidden></div>
    <div id="tabs" class="tabs"></div>
    <div id="chips" class="chips"></div>
    <div id="list"></div>
  </div>
  <p id="msg" class="center"></p>
</div>
<script>
if (!Element.prototype.replaceChildren) {
  Element.prototype.replaceChildren = function () {
    while (this.firstChild) this.removeChild(this.firstChild);
    for (var i = 0; i < arguments.length; i++) {
      var a = arguments[i];
      this.appendChild(typeof a === "string" ? document.createTextNode(a) : a);
    }
  };
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="assets/main.js"></script>
</body>
</html>
