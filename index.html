<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>نشرة الدفعة</title>
<script>
  try {
    var t = localStorage.getItem("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f5efe1; --card:#fffaf0; --ink:#2b2418; --line:#c9b98f; --accent:#8a5a1f; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper:#1c1812; --card:#26211a; --ink:#efe6d2; --line:#5a4d33; --accent:#d9a55b; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --paper:#1c1812; --card:#26211a; --ink:#efe6d2; --line:#5a4d33; --accent:#d9a55b; color-scheme:dark; }

  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:"Amiri","Noto Naskh Arabic",Georgia,serif; font-size:18px;
    display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:12px;
    padding:24px; max-width:420px; width:100%; text-align:center; }
  .label { font-family:ui-monospace,Menlo,monospace; font-size:12px;
    letter-spacing:.08em; color:var(--accent); margin:0 0 8px; direction:ltr; }
  h1 { margin:0 0 16px; }
  button { font:inherit; padding:8px 18px; border:2px solid var(--line);
    border-radius:8px; background:transparent; color:var(--ink); cursor:pointer; }
  .small { font-size:14px; padding:4px 12px; margin-top:16px; }
  #msg { min-height:1.4em; color:var(--accent); }
</style>
</head>
<body>
<div class="card">
  <p class="label">BATCH BOARD</p>
  <h1>نشرة الدفعة</h1>

  <div id="login-box">
    <p>الدخول بتيليجرام</p>
    <script async src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="MATHDEPARTMENT_BOT" data-size="large"
      data-onauth="onTelegramAuth(user)" data-request-access="write"></script>
  </div>

  <div id="user-box" hidden>
    <p id="welcome"></p>
    <p id="status" class="label"></p>
    <button id="logout">تسجيل الخروج</button>
  </div>

  <p id="msg"></p>
  <button id="theme-btn" class="small"></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://xwnjimsoframcqstdjfo.supabase.co";
const SUPABASE_KEY = "sb_publishable_GxJNb-tD7jTgxskyPpgVLQ_ZNJZ9mm3";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
function say(t) { $("msg").textContent = t; }

/* المظهر: تلقائي / داكن / فاتح */
const labels = { auto: "تلقائي", dark: "داكن", light: "فاتح" };
const order = ["auto", "dark", "light"];
let theme = "auto";
try { theme = localStorage.getItem("theme") || "auto"; } catch (e) {}
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("theme-btn").textContent = "المظهر: " + labels[theme];
}
$("theme-btn").addEventListener("click", () => {
  theme = order[(order.indexOf(theme) + 1) % order.length];
  try { localStorage.setItem("theme", theme); } catch (e) {}
  applyTheme();
});
applyTheme();

async function showProfile() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("login-box").hidden = false; $("user-box").hidden = true; return; }
  const { data, error } = await sb.from("profiles")
    .select("first_name, role, approved").eq("id", session.user.id).single();
  if (error || !data) { say("تعذّر تحميل الحساب"); return; }
  $("login-box").hidden = true;
  $("user-box").hidden = false;
  $("welcome").textContent = "أهلًا " + (data.first_name || "");
  $("status").textContent = data.approved
    ? "STATUS: APPROVED / " + data.role
    : "STATUS: PENDING APPROVAL";
  say("");
}

async function onTelegramAuth(user) {
  say("جاري تسجيل الدخول...");
  const { data, error } = await sb.functions.invoke("telegram-auth", { body: user });
  if (error || !data || !data.token_hash) { say("فشل الدخول، حاول تاني"); return; }
  const { error: e2 } = await sb.auth.verifyOtp({ token_hash: data.token_hash, type: "magiclink" });
  if (e2) { say("فشل إكمال الدخول"); return; }
  await showProfile();
}

$("logout").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
showProfile();
</script>
</body>
</html>
