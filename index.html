<style>
  :root { --paper:#f5efe1; --card:#fffaf0; --ink:#2b2418; --line:#c9b98f; --accent:#8a5a1f; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper:#1c1812; --card:#26211a; --ink:#efe6d2; --line:#5a4d33; --accent:#d9a55b; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --paper:#1c1812; --card:#26211a; --ink:#efe6d2; --line:#5a4d33; --accent:#d9a55b; color-scheme:dark; }

  [hidden] { display:none !important; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:"Amiri","Noto Naskh Arabic",Georgia,serif; font-size:18px; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:center;
    gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  h1 { margin:0; font-size:26px; direction:ltr; text-align:right; }
  h3 { margin:0 0 8px; }
  .label { font-family:ui-monospace,Menlo,monospace; font-size:12px;
    letter-spacing:.08em; color:var(--accent); margin:0 0 4px; direction:ltr; text-align:right; }
  .meta { font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--accent); margin:8px 0; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:12px;
    padding:16px; margin-bottom:12px; }
  .center { text-align:center; }
  .body { white-space:pre-wrap; margin:8px 0; }
  button, a.btn { font:inherit; padding:8px 18px; border:2px solid var(--line);
    border-radius:8px; background:transparent; color:var(--ink); cursor:pointer;
    text-decoration:none; display:inline-block; }
  .small { font-size:14px; padding:4px 12px; }
  .tabs, .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:12px; }
  .tab, .chip { flex:none; }
  .chip { font-size:14px; padding:4px 12px; }
  .tab.active, .chip.active { background:var(--accent); color:var(--paper); border-color:var(--accent); }
  label.chk { display:inline-flex; align-items:center; gap:8px; margin-inline-end:20px; cursor:pointer; }
  input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); }
  input[type=text], input[type=url], input[type=datetime-local], textarea, select {
    width:100%; box-sizing:border-box; font:inherit; padding:8px;
    border:2px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); }
  .field { margin-bottom:12px; }
  .field label { display:block; margin-bottom:4px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  button.danger { border-color:#b3472f; color:#d9694f; }
  .doneitem h3, .doneitem .body, .doneitem .meta { text-decoration:line-through; opacity:.6; }
  #msg { min-height:1.4em; color:var(--accent); }
</style>

    <script async src="https://telegram.org/js/telegram-widget.js?22"

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://xwnjimsoframcqstdjfo.supabase.co";
const SUPABASE_KEY = "sb_publishable_GxJNb-tD7jTgxskyPpgVLQ_ZNJZ9mm3";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
function say(t) { $("msg").textContent = t; }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function showLoading(on) { $("loading").hidden = !on; }

/* المظهر */
const labels = { auto: "تلقائي", dark: "داكن", light: "فاتح" };
const order = ["auto", "dark", "light"];
let theme = "auto";
try { theme = localStorage.getItem("theme") || "auto"; } catch (e) {}
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("theme-btn").textContent = "المظهر: " + labels[theme];
}
$("theme-btn").addEventListener("click", () => {
  theme = order[(order.indexOf(theme) + 1) % order.length];
  try { localStorage.setItem("theme", theme); } catch (e) {}
  applyTheme();
});
applyTheme();

/* التوقيت (توقيت مصر) */
const dateFmt = new Intl.DateTimeFormat("ar-EG", {
  timeZone: "Africa/Cairo", dateStyle: "full", timeStyle: "short",
});
function fmt(iso) { return dateFmt.format(new Date(iso)); }
function tzOffset(ms) {
  const p = {};
  new Intl.DateTimeFormat("en-US", {
    timeZone: "Africa/Cairo", hourCycle: "h23", year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit",
  }).formatToParts(new Date(ms)).forEach((x) => { p[x.type] = x.value; });
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second)
    - Math.floor(ms / 1000) * 1000;
}
function localToISO(v) {
  const [d, t] = v.split("T");
  const [y, m, da] = d.split("-").map(Number);
  const [h, mi] = t.split(":").map(Number);
  const base = Date.UTC(y, m - 1, da, h, mi);
  let ms = base - tzOffset(base);
  ms = base - tzOffset(ms);
  return new Date(ms).toISOString();
}
function toLocalInput(iso) {
  const ms = new Date(iso).getTime();
  return new Date(ms + tzOffset(ms)).toISOString().slice(0, 16);
}
function safeUrl(u) {
  try {
    const x = new URL(u);
    return (x.protocol === "https:" || x.protocol === "http:") ? x.href : null;
  } catch (e) { return null; }
}

const state = { userId: null, role: null, sections: [], items: [], progress: {},
  courses: [], mine: new Set(), chosen: false,
  active: null, filter: "all", trash: false, form: null };
const isAdmin = () => state.role === "admin" || state.role === "full_admin";
const isFull = () => state.role === "full_admin";
const courseName = (id) => (state.courses.find((c) => c.id === id) || {}).name || "";

function setView(v) {
  $("app").hidden = v !== "app";
  $("picker-box").hidden = v !== "picker";
  $("courses-box").hidden = v !== "courses";
  if (v === "picker") renderPicker();
  if (v === "courses") renderCourses();
  if (v === "app") render();
}

async function loadCourses() {
  const [c, u] = await Promise.all([
    sb.from("courses").select("id,name,sort_order,is_active").order("sort_order").order("name"),
    sb.from("user_courses").select("course_id"),
  ]);
  if (c.error || u.error) { say("تعذّر تحميل المواد"); return false; }
  state.courses = c.data;
  state.mine = new Set(u.data.map((r) => r.course_id));
  return true;
}

async function fetchData() {
  const [s, i, p] = await Promise.all([
    sb.from("sections").select("id,title,kind,sort_order").eq("is_active", true).order("sort_order"),
    sb.from("items").select("id,section_id,course_id,title,body,url,deadline,created_at,deleted_at"),
    sb.from("progress").select("item_id,done,submitted"),
  ]);
  if (s.error || i.error || p.error) { say("تعذّر تحميل البيانات"); return false; }
  state.sections = s.data;
  state.items = i.data;
  state.progress = {};
  p.data.forEach((r) => { state.progress[r.item_id] = r; });
  if (!state.sections.find((x) => x.id === state.active)) {
    state.active = state.sections.length ? state.sections[0].id : null;
  }
  return true;
}

async function loadData() {
  if (await fetchData()) render();
}

function check(text, val, onChange) {
  const l = el("label", "chk");
  const i = document.createElement("input");
  i.type = "checkbox";
  i.checked = val;
  i.addEventListener("change", () => onChange(i.checked));
  l.appendChild(i);
  l.appendChild(document.createTextNode(text));
  return l;
}

function field(text, node) {
  const w = el("div", "field");
  w.appendChild(el("label", "", text));
  w.appendChild(node);
  return w;
}

/* اختيار المواد */
function renderPicker() {
  const box = $("picker-box");
  box.replaceChildren();
  box.appendChild(el("h3", "", "اختيار المواد"));
  box.appendChild(el("p", "", "اختيار المواد المسجَّل فيها. تظهر التكاليف الخاصة بها فقط، ويمكن تغيير الاختيار في أي وقت."));
  const sel = new Set(state.mine);
  const act = state.courses.filter((c) => c.is_active);
  if (!act.length) box.appendChild(el("p", "meta", "لا توجد مواد بعد"));
  act.forEach((c) => {
    const row = el("div");
    row.appendChild(check(c.name, sel.has(c.id), (v) => { if (v) sel.add(c.id); else sel.delete(c.id); }));
    box.appendChild(row);
  });
  const row = el("div", "row");
  const ok = el("button", "", "حفظ");
  ok.addEventListener("click", async () => {
    ok.disabled = true;
    let e = (await sb.from("user_courses").delete().eq("user_id", state.userId)).error;
    if (!e && sel.size) {
      e = (await sb.from("user_courses").insert(
        [...sel].map((id) => ({ user_id: state.userId, course_id: id }))
      )).error;
    }
    if (!e) e = (await sb.from("profiles").update({ courses_chosen: true }).eq("id", state.userId)).error;
    ok.disabled = false;
    if (e) { say("تعذّر الحفظ"); return; }
    state.chosen = true;
    state.mine = new Set(sel);
    state.filter = "all";
    say("تم الحفظ");
    await loadData();
    setView("app");
  });
  row.appendChild(ok);
  if (state.chosen) {
    const cancel = el("button", "", "إلغاء");
    cancel.addEventListener("click", () => setView("app"));
    row.appendChild(cancel);
  }
  box.appendChild(row);
}

/* إدارة المواد (للأدمنز) */
function renderCourses() {
  const box = $("courses-box");
  box.replaceChildren();
  const top = el("div", "row");
  top.appendChild(el("h3", "", "إدارة المواد"));
  const back = el("button", "small", "رجوع");
  back.addEventListener("click", () => setView("app"));
  top.appendChild(back);
  box.appendChild(top);

  const add = el("div", "card");
  const inp = el("input");
  inp.type = "text";
  inp.placeholder = "اسم المادة";
  add.appendChild(inp);
  const b = el("button", "", "إضافة مادة");
  b.style.marginTop = "8px";
  b.addEventListener("click", async () => {
    const name = inp.value.trim();
    if (!name) { say("اسم المادة مطلوب"); return; }
    const next = state.courses.reduce((m, c) => Math.max(m, c.sort_order), 0) + 1;
    const { error } = await sb.from("courses").insert({ name, sort_order: next });
    if (error) { say(error.code === "23505" ? "المادة موجودة بالفعل" : "تعذّر الحفظ"); return; }
    say("تمت الإضافة");
    await loadCourses();
    renderCourses();
  });
  add.appendChild(b);
  box.appendChild(add);

  state.courses.forEach((c) => {
    const card = el("div", "card");
    card.appendChild(el("h3", "", c.name + (c.is_active ? "" : " (متوقفة)")));
    const row = el("div", "row");
    const rn = el("button", "small", "تعديل الاسم");
    rn.addEventListener("click", async () => {
      const name = (prompt("الاسم الجديد", c.name) || "").trim();
      if (!name || name === c.name) return;
      const { error } = await sb.from("courses").update({ name }).eq("id", c.id);
      if (error) { say(error.code === "23505" ? "الاسم مستخدم بالفعل" : "تعذّر الحفظ"); return; }
      say("");
      await loadCourses();
      renderCourses();
    });
    const tg = el("button", "small", c.is_active ? "إيقاف" : "تفعيل");
    tg.addEventListener("click", async () => {
      const { error } = await sb.from("courses").update({ is_active: !c.is_active }).eq("id", c.id);
      if (error) { say("تعذّر الحفظ"); return; }
      say("");
      await loadCourses();
      renderCourses();
    });
    row.appendChild(rn);
    row.appendChild(tg);
    if (isFull()) {
      const del = el("button", "small danger", "حذف");
      del.addEventListener("click", async () => {
        if (!confirm("حذف المادة نهائيًا؟ سيتم إلغاء تسجيل الناس فيها ولا يمكن التراجع.")) return;
        const { data, error } = await sb.from("courses").delete().eq("id", c.id).select("id");
        if (error) {
          say(error.code === "23503"
            ? "المادة مرتبطة بعناصر (حتى الموجودة في السلة). الأفضل إيقافها."
            : "تعذّر الحذف");
          return;
        }
        if (!data || !data.length) { say("تعذّر الحذف"); return; }
        say("تم الحذف");
        await loadCourses();
        renderCourses();
      });
      row.appendChild(del);
    }
    card.appendChild(row);
    box.appendChild(card);
  });
}

/* التقدّم والحذف */
async function save(itemId, done, submitted) {
  const { error } = await sb.from("progress").upsert(
    { user_id: state.userId, item_id: itemId, done, submitted, updated_at: new Date().toISOString() },
    { onConflict: "user_id,item_id" }
  );
  if (error) { say("تعذّر الحفظ"); return; }
  state.progress[itemId] = { item_id: itemId, done, submitted };
  say("");
  render();
}

async function setDeleted(id, val) {
  if (val && !confirm("تأكيد الحذف؟ يمكن استرجاعه من سلة المحذوفات.")) return;
  const { error } = await sb.from("items")
    .update({ deleted_at: val ? new Date().toISOString() : null }).eq("id", id);
  if (error) { say("تعذّر التنفيذ"); return; }
  say(val ? "تم الحذف" : "تم الاسترجاع");
  await loadData();
}

/* نموذج الإضافة والتعديل */
function buildForm(sec, it) {
  const c = el("div", "card");
  c.appendChild(el("h3", "", it ? "تعديل" : "إضافة"));

  const title = el("input");
  title.type = "text";
  title.value = it ? it.title : "";
  c.appendChild(field("العنوان", title));

  const body = el("textarea");
  body.rows = 4;
  body.value = it && it.body ? it.body : "";
  c.appendChild(field("التفاصيل", body));

  const csel = el("select");
  const first = el("option", "", sec.kind === "news" ? "أخبار عامة" : "— اختيار المادة —");
  first.value = "";
  csel.appendChild(first);
  state.courses
    .filter((x) => x.is_active || (it && it.course_id === x.id))
    .forEach((x) => {
      const o = el("option", "", x.name);
      o.value = String(x.id);
      csel.appendChild(o);
    });
  csel.value = it && it.course_id != null ? String(it.course_id) : "";
  c.appendChild(field(sec.kind === "news" ? "التصنيف" : "المادة", csel));

  let url = null, dl = null;
  if (sec.kind === "links") {
    url = el("input");
    url.type = "url";
    url.dir = "ltr";
    url.value = it && it.url ? it.url : "";
    c.appendChild(field("الرابط", url));
  }
  if (sec.kind === "tasks") {
    dl = el("input");
    dl.type = "datetime-local";
    dl.value = it && it.deadline ? toLocalInput(it.deadline) : "";
    c.appendChild(field("الميعاد (التاريخ والساعة)", dl));
  }

  const row = el("div", "row");
  const ok = el("button", "", "حفظ");
  const cancel = el("button", "", "إلغاء");
  cancel.addEventListener("click", () => { state.form = null; say(""); render(); });
  ok.addEventListener("click", async () => {
    const data = { title: title.value.trim(), body: body.value.trim() || null };
    if (!data.title) { say("العنوان مطلوب"); return; }
    if (sec.kind !== "news" && !csel.value) { say("المادة مطلوبة"); return; }
    data.course_id = csel.value ? Number(csel.value) : null;
    if (dl) {
      if (!dl.value) { say("الميعاد مطلوب (التاريخ والساعة)"); return; }
      data.deadline = localToISO(dl.value);
    }
    if (url) {
      const u = safeUrl(url.value.trim());
      if (!u) { say("الرابط غير صالح"); return; }
      data.url = u;
    }
    ok.disabled = true;
    const { error } = it
      ? await sb.from("items").update(data).eq("id", it.id)
      : await sb.from("items").insert({ ...data, section_id: sec.id });
    ok.disabled = false;
    if (error) { say("تعذّر الحفظ"); return; }
    state.form = null;
    say("تم الحفظ");
    await loadData();
  });
  row.appendChild(ok);
  row.appendChild(cancel);
  c.appendChild(row);
  return c;
}

/* العرض */
const isDone = (it) => { const p = state.progress[it.id]; return !!(p && p.done && p.submitted); };

function visible(sec, it) {
  if (sec.kind === "tasks" && !isAdmin() && !state.mine.has(it.course_id)) return false;
  if (state.filter === "all") return true;
  if (state.filter === "general") return it.course_id == null;
  return it.course_id === state.filter;
}

function card(sec, it) {
  const c = el("div", "card" + (sec.kind === "tasks" && !it.deleted_at && isDone(it) ? " doneitem" : ""));
  c.appendChild(el("h3", "", it.title));
  const cn = it.course_id != null ? courseName(it.course_id) : (sec.kind === "news" ? "أخبار عامة" : "");
  if (cn) c.appendChild(el("p", "meta", cn));
  if (it.body) c.appendChild(el("p", "body", it.body));

  if (sec.kind === "tasks") {
    if (it.deadline) c.appendChild(el("p", "meta", "الميعاد: " + fmt(it.deadline)));
    if (!it.deleted_at) {
      const pr = state.progress[it.id] || { done: false, submitted: false };
      const row = el("div");
      row.appendChild(check("خلّصت", pr.done, (v) => save(it.id, v, v ? pr.submitted : false)));
      row.appendChild(check("سلّمت", pr.submitted, (v) => save(it.id, v ? true : pr.done, v)));
      c.appendChild(row);
    }
  } else if (sec.kind === "links") {
    const u = it.url ? safeUrl(it.url) : null;
    if (u) {
      const a = el("a", "btn", "فتح الرابط");
      a.href = u;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      c.appendChild(a);
    }
  } else {
    c.appendChild(el("p", "meta", fmt(it.created_at)));
  }

  if (isAdmin()) {
    const row = el("div", "row");
    if (it.deleted_at) {
      const r = el("button", "small", "استرجاع");
      r.addEventListener("click", () => setDeleted(it.id, false));
      row.appendChild(r);
    } else {
      const e = el("button", "small", "تعديل");
      e.addEventListener("click", () => { state.form = { id: it.id }; say(""); render(); });
      const d = el("button", "small danger", "حذف");
      d.addEventListener("click", () => setDeleted(it.id, true));
      row.appendChild(e);
      row.appendChild(d);
    }
    c.appendChild(row);
  }
  return c;
}

function renderChips(sec) {
  const chips = $("chips");
  chips.replaceChildren();
  const add = (label, val) => {
    const b = el("button", "chip" + (state.filter === val ? " active" : ""), label);
    b.addEventListener("click", () => { state.filter = val; render(); });
    chips.appendChild(b);
  };
  add("الكل", "all");
  if (sec.kind === "news") add("أخبار عامة", "general");
  const list = (sec.kind === "tasks" && !isAdmin())
    ? state.courses.filter((c) => c.is_active && state.mine.has(c.id))
    : state.courses.filter((c) => c.is_active);
  list.forEach((c) => add(c.name, c.id));
}

function render() {
  const tabs = $("tabs");
  tabs.replaceChildren();
  state.sections.forEach((sec) => {
    const b = el("button", "tab" + (sec.id === state.active ? " active" : ""), sec.title);
    b.addEventListener("click", () => {
      state.active = sec.id; state.form = null; state.trash = false; state.filter = "all"; render();
    });
    tabs.appendChild(b);
  });

  const list = $("list");
  list.replaceChildren();
  const sec = state.sections.find((x) => x.id === state.active);
  if (!sec) { $("chips").replaceChildren(); list.appendChild(el("p", "center", "لا توجد أقسام بعد")); return; }
  renderChips(sec);

  const inSec = state.items.filter((x) => x.section_id === sec.id);
  const dead = inSec.filter((x) => x.deleted_at);
  const live = inSec.filter((x) => !x.deleted_at && visible(sec, x));

  if (isAdmin()) {
    const bar = el("div", "row");
    const add = el("button", "", "+ إضافة");
    add.addEventListener("click", () => { state.form = { id: null }; state.trash = false; say(""); render(); });
    const tr = el("button", "", state.trash ? "رجوع" : "سلة المحذوفات (" + dead.length + ")");
    tr.addEventListener("click", () => { state.trash = !state.trash; state.form = null; render(); });
    bar.appendChild(add);
    bar.appendChild(tr);
    list.appendChild(bar);
  }

  if (state.form) {
    const it = state.form.id ? state.items.find((x) => x.id === state.form.id) : null;
    list.appendChild(buildForm(sec, it));
  }

  const items = state.trash ? dead : live;
  const t = (x) => x.deadline ? new Date(x.deadline).getTime() : Infinity;
  if (sec.kind === "tasks") {
    items.sort((a, b) => {
      const da = isDone(a) ? 1 : 0, db = isDone(b) ? 1 : 0;
      if (da !== db) return da - db;
      return t(a) === t(b) ? 0 : (t(a) < t(b) ? -1 : 1);
    });
  } else {
    items.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  }
  if (!items.length) {
    list.appendChild(el("p", "center", state.trash ? "السلة فارغة" : "لا يوجد شيء هنا حتى الآن"));
  }
  items.forEach((it) => list.appendChild(card(sec, it)));
}

/* الدخول والحساب */
function hideAll() {
  $("app").hidden = true;
  $("picker-box").hidden = true;
  $("courses-box").hidden = true;
  $("courses-btn").hidden = true;
  $("manage-btn").hidden = true;
}

async function showProfile() {
  showLoading(true);
  hideAll();
  $("login-box").hidden = true;
  $("pending-box").hidden = true;

  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    showLoading(false);
    $("logout").hidden = true;
    $("login-box").hidden = false;
    return;
  }
  state.userId = session.user.id;
  $("logout").hidden = false;

  const { data, error } = await sb.from("profiles")
    .select("first_name, role, approved, courses_chosen").eq("id", state.userId).single();
  if (error || !data) { showLoading(false); say("تعذّر تحميل الحساب"); return; }

  state.role = data.role;
  state.chosen = !!data.courses_chosen;

  if (!data.approved) {
    showLoading(false);
    $("welcome").textContent = "أهلًا " + (data.first_name || "");
    $("pending-box").hidden = false;
    return;
  }

  $("hello").textContent = "WELCOME " + (data.first_name || "") + " / " + data.role;
  say("");
  const [okC, okD] = await Promise.all([loadCourses(), fetchData()]);
  showLoading(false);
  if (!okC || !okD) return;

  $("courses-btn").hidden = false;
  $("manage-btn").hidden = !isAdmin();
  if (!state.chosen && state.courses.some((c) => c.is_active)) setView("picker");
  else setView("app");
}

async function onTelegramAuth(user) {
  $("login-box").hidden = true;
  showLoading(true);
  say("");
  const fail = (m) => { showLoading(false); $("login-box").hidden = false; say(m); };
  const { data, error } = await sb.functions.invoke("telegram-auth", { body: user });
  if (error || !data || !data.token_hash) { fail("فشل الدخول، برجاء إعادة المحاولة"); return; }
  const { error: e2 } = await sb.auth.verifyOtp({ token_hash: data.token_hash, type: "magiclink" });
  if (e2) { fail("فشل إكمال الدخول"); return; }
  await showProfile();
}

$("courses-btn").addEventListener("click", () => setView("picker"));
$("manage-btn").addEventListener("click", () => setView("courses"));
$("logout").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
showProfile();
</script>
