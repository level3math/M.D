<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>math 3</title>
<script>
  try {
    var t = localStorage.getItem("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/math3.css">
</head>
<body>
<script src="assets/ios-compat.js"></script>
<button id="links-fab" class="links-fab" hidden>🔗</button>
<div id="links-panel" class="links-panel" hidden></div>
<div class="wrap">
  <header>
    <div>
      <p class="label">BATCH BOARD</p>
      <h1>math 3</h1>
    </div>
    <div class="row">
      <button id="courses-btn" class="small" hidden>موادّي</button>
      <button id="manage-btn" class="small" hidden>إدارة المواد</button>
      <button id="people-btn" class="small" hidden>users</button>
      <button id="log-btn" class="small" hidden>السجل</button>
      <button id="backup-btn" class="small" hidden>نسخة احتياطية</button>
      <button id="logout" class="small" hidden>خروج</button>
    </div>
  </header>
  <div id="loading" class="card center">
    <p>جاري التحميل...</p>
  </div>
  <div id="login-box" class="card center" hidden>
    <div id="saved-accounts"></div>
    <div id="tg-widget-wrap">
      <p id="login-label">الدخول بتيليجرام</p>
      <div id="tg-slot"></div>
      <script>
        if (!window.IS_IOS) {
          document.write('<script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="MATHDEPARTMENT_BOT" data-size="large" data-onauth="onTelegramAuth(user)" data-request-access="write"><\/script>');
        }
      </script>
    </div>
  </div>
  <div id="pending-box" class="card center" hidden>
    <p id="welcome"></p>
    <p class="label" style="text-align:center">STATUS: SUSPENDED</p>
    <p>الحساب غير مفعّل حاليًا. للاستفسار، برجاء التواصل مع المسؤولين.</p>
  </div>
  <div id="picker-box" class="card" hidden></div>
  <div id="courses-box" hidden></div>
  <div id="people-box" hidden></div>
  <div id="log-box" hidden></div>
  <div id="app" hidden>
    <p id="hello" class="label"></p>
    <div id="bot-banner" class="card" hidden></div>
    <div id="dashboard" hidden></div>
    <div id="tabs" class="tabs"></div>
    <div id="chips" class="chips"></div>
    <div id="list"></div>
  </div>
  <p id="msg" class="center"></p>
</div>
<script>
if (!Element.prototype.replaceChildren) {
  Element.prototype.replaceChildren = function () {
    while (this.firstChild) this.removeChild(this.firstChild);
    for (var i = 0; i < arguments.length; i++) {
      var a = arguments[i];
      this.appendChild(typeof a === "string" ? document.createTextNode(a) : a);
    }
  };
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="assets/main.js"></script>
</body>
</html>
