  .wrap { max-width:720px; margin:0 auto; padding:16px; position:relative; z-index:1; }
  header { display:flex; justify-content:space-between; align-items:center;
    gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  h1 { margin:0; font-size:26px; direction:ltr; text-align:right; }
  h3 { margin:0 0 8px; }
  .label { font-family:ui-monospace,Menlo,monospace; font-size:12px;
    letter-spacing:.08em; color:var(--accent); margin:0 0 4px; direction:ltr; text-align:right; }
  .meta { font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--accent); margin:8px 0; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:12px;
    padding:16px; margin-bottom:12px; }
  .post-image-wrap { margin-top:12px; text-align:center; }
  .post-image { display:block; width:100%; max-height:70vh; object-fit:contain; border-radius:8px; }
  .center { text-align:center; }
  .body { white-space:pre-wrap; margin:8px 0; }
  button, a.btn { font:inherit; padding:8px 18px; border:2px solid var(--line);
    border-radius:8px; background:transparent; color:var(--ink); cursor:pointer;
    text-decoration:none; display:inline-block; }
  .small { font-size:14px; padding:4px 12px; }
  .tabs, .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:12px; }
  .tab, .chip { flex:none; }
  .chip { font-size:14px; padding:4px 12px; }
  .tab.active, .chip.active { background:var(--accent); color:var(--paper); border-color:var(--accent); }

async function changeRole(p, role, sel) {
  if (role === p.role) return;
  if (!confirm("تغيير دور " + (p.first_name || "هذا الحساب") + " إلى " + roleLabels[role] + "؟")) {
    sel.value = p.role;
    return;
  }
  const { error } = await sb.rpc("set_role", { target: p.id, new_role: role });
  if (error) { sel.value = p.role; say(rpcMsg(error)); return; }
  p.role = role;
  say("تم تغيير الدور");
  renderPeople(false);
}
async function toggleBlock(p) {
  const block = p.approved;
  const q = block
    ? "إيقاف هذا الحساب؟ لن يرى أي محتوى حتى يتم تفعيله."
    : "تفعيل هذا الحساب؟";
  if (!confirm(q)) return;
  const { error } = await sb.rpc("set_blocked", { target: p.id, blocked: block });
  if (error) { say(rpcMsg(error)); return; }
  p.approved = !block;
  say(block ? "تم إيقاف الحساب" : "تم تفعيل الحساب");
  renderPeople(false);
}
async function deletePerson(p) {
  if (!confirm("حذف " + (p.first_name || "هذا الحساب") + " من الـ users؟\nهيقدر يرجع يظهر تاني لو عمل تسجيل دخول بتيليجرام من جديد.")) return;
  const { error } = await sb.rpc("delete_profile", { target: p.id });
  if (error) { say(rpcMsg(error)); return; }

  say("تم الحذف");
  renderPeople(false);
}
function personCard(p) {

async function renderPeople(reload) {
  const box = $("people-box");
  if (reload) {
    showLoading(true);
    const { data, error } = await sb.from("profiles")
      .select("id,first_name,username,role,approved,created_at,bot_ok")
      .order("created_at", { ascending: false });
    showLoading(false);
    if (error) { say("تعذّر تحميل الحسابات", true); return; }
    state.people = data;
    state.peopleQuery = "";
    state.peopleLimit = 50;
  }
  box.replaceChildren();
  const top = el("div", "row");
  top.appendChild(el("h3", "", "users"));
  const back = el("button", "small", "رجوع");
  back.addEventListener("click", () => setView("app"));
  top.appendChild(back);
  box.appendChild(top);
  const q = el("input");
  q.type = "text";
  q.placeholder = "بحث بالاسم أو اليوزر";
  q.value = state.peopleQuery;
  box.appendChild(q);
  const info = el("p", "meta");
  box.appendChild(info);
  const res = el("div");
  box.appendChild(res);
  const paint = () => {
    res.replaceChildren();
    const s = state.peopleQuery.trim().toLowerCase().replace(/^@/, "");
    const all = state.people.filter((p) => !s
      || (p.first_name || "").toLowerCase().includes(s)
      || (p.username || "").toLowerCase().includes(s));
    all.sort((a, b) => (roleRank[a.role] != null ? roleRank[a.role] : 3) - (roleRank[b.role] != null ? roleRank[b.role] : 3));
    const shown = all.slice(0, state.peopleLimit);
    info.textContent = "الحسابات: " + state.people.length + (s ? " · النتائج: " + all.length : "")
      + " · الإشعارات متوقفة عند: " + state.people.filter((p) => p.bot_ok === false).length;
    shown.forEach((p) => res.appendChild(personCard(p)));
    if (all.length > shown.length) {
      const more = el("button", "", "عرض المزيد");
      more.addEventListener("click", () => { state.peopleLimit += 50; paint(); });
      res.appendChild(more);
    }
  };

  paint();
}

async function emptyTrash(ids) {
  if (!ids.length) return;
  if (!confirm("تفريغ السلة؟ سيتم حذف " + ids.length + " عنصر نهائيًا ولا يمكن التراجع.")) return;
  const paths = state.items.filter((x) => ids.includes(x.id) && x.attachment_path).map((x) => x.attachment_path);
  const { data, error } = await sb.from("items").delete().in("id", ids).select("id");
  if (error || !data) { say("تعذّر تفريغ السلة"); return; }

function postUrl(id) {
  const base = location.pathname.replace(/\/(?:index\.html)?$/, "/");
  return new URL(base + "posts/" + encodeURIComponent(id), location.origin).href;
}
function getPostIdFromLocation() {
  const m = location.pathname.match(/\/posts\/(\d+)\/?$/);
  if (m) return Number(m[1]);
  try {
    const q = new URLSearchParams(location.search);
    const id = q.get("post");
    return id && /^\d+$/.test(id) ? Number(id) : null;
  } catch (e) {
    return null;
  }
}
function postStoragePath(url) {
  if (!url) return null;
  try {
    const u = new URL(url);
    const marker = "/storage/v1/object/public/attachments/";
    const i = u.pathname.indexOf(marker);
    return i === -1 ? null : decodeURIComponent(u.pathname.slice(i + marker.length));
  } catch (e) {
    return null;
  }
}
async function uploadPostImage(file) {
  if (!file || !file.type.startsWith("image/")) return { error: { message: "image_only" } };
  if (file.size > MAX_ATTACH) return { error: { message: "too_large" } };
  const safeName = file.name.replace(/[^\w.\-]+/g, "_").slice(-80);
  const path = "posts/" + Date.now() + "_" + Math.random().toString(36).slice(2, 8) + "_" + safeName;
  const { error } = await sb.storage.from("attachments").upload(path, file, {
    contentType: file.type,
    upsert: false,
  });
  if (error) return { error };
  const { data } = sb.storage.from("attachments").getPublicUrl(path);
  return { data: { image_url: data.publicUrl, image_path: path } };
}

  c.appendChild(el("h3", "", isEdit ? "تعديل المنشور" : "منشور جديد"));

  body.rows = 6;
  body.placeholder = "اكتب المنشور (اختياري إذا أضفت صورة)";
  body.value = post && post.content ? post.content : "";
  c.appendChild(field("النص", body));

  const fi = el("input");
  fi.type = "file";
  fi.accept = "image/*";
  let selectedFile = null;
  fi.addEventListener("change", () => {
    selectedFile = fi.files[0] || null;
  });
  c.appendChild(field("الصورة (اختياري)", fi));

  if (post && post.image_url) {
    const current = el("div", "meta", post._removeImage ? "سيتم إزالة الصورة الحالية عند الحفظ." : "توجد صورة حالية. اختيار صورة جديدة سيستبدلها.");
    c.appendChild(current);
    const remove = el("button", post._removeImage ? "small" : "small danger", post._removeImage ? "إلغاء إزالة الصورة" : "إزالة الصورة الحالية");
    remove.addEventListener("click", () => {
      post._removeImage = !post._removeImage;
      render();
    });
    c.appendChild(remove);
  }

  const row = el("div", "row");
  const save = el("button", "", isEdit ? "حفظ التعديل" : "نشر");
  const cancel = el("button", "small", "إلغاء");
  save.addEventListener("click", async () => {
    const content = body.value.trim();
    if (!content && !selectedFile && !(post && post.image_url && !post._removeImage)) {
      say("اكتب المنشور أو اختر صورة");
      return;
    }
    if (selectedFile && selectedFile.size > MAX_ATTACH) {
      say("الصورة أكبر من 10 ميجا");
      return;
    }
    if (selectedFile && !selectedFile.type.startsWith("image/")) {
      say("الملف يجب أن يكون صورة");
      return;
    }
    save.disabled = true;
    let uploaded = null;
    if (selectedFile) {
      uploaded = await uploadPostImage(selectedFile);
      if (uploaded.error) {
        save.disabled = false;
        say(uploaded.error.message === "too_large" ? "الصورة أكبر من 10 ميجا" : "تعذّر رفع الصورة");
        return;
      }
    }

    let error = null;
    let newId = post ? post.id : null;
    if (isEdit) {
      const payload = {
        content: content || null,
        image_url: uploaded ? uploaded.data.image_url : (post._removeImage ? null : post.image_url),
      };
      ({ error } = await sb.from("posts").update(payload).eq("id", post.id));
      if (!error && (uploaded || post._removeImage) && post.image_url) {
        const oldPath = postStoragePath(post.image_url);
        if (oldPath) await sb.storage.from("attachments").remove([oldPath]);
      }
    } else {
      const ins = await sb.from("posts").insert({
        content: content || null,
        image_url: uploaded ? uploaded.data.image_url : null,
      }).select("id").single();
      error = ins.error;
      newId = ins.data && ins.data.id;
    }

    if (error) {
      if (uploaded && uploaded.data.image_path) {
        await sb.storage.from("attachments").remove([uploaded.data.image_path]);
      }
      save.disabled = false;
      say("تعذّر حفظ المنشور: " + error.message, true);
      return;
    }

    state.postForm = null;
    state.postFocus = newId;
    say(isEdit ? "تم تعديل المنشور" : "تم نشر المنشور");
    if (!isEdit && newId) notifyNewPost(newId);
    await loadData();
  });
  cancel.addEventListener("click", () => {
    state.postForm = null;
    render();
  });
  row.appendChild(save);
  row.appendChild(cancel);
  c.appendChild(row);
  return c;
}
async function setPostDeleted(id, deleted) {
  const { error } = await sb.from("posts").update({ deleted_at: deleted ? new Date().toISOString() : null }).eq("id", id);
  if (error) { say(deleted ? "تعذّر حذف المنشور" : "تعذّر استرجاع المنشور"); return; }
  state.postFocus = null;
  await loadData();
}
async function purgePost(post) {
  if (!confirm("حذف المنشور نهائيًا؟")) return;
  const { error } = await sb.from("posts").delete().eq("id", post.id).not("deleted_at", "is", null);
  if (error) { say("تعذّر الحذف النهائي: " + error.message, true); return; }
  const path = postStoragePath(post.image_url);
  if (path) await sb.storage.from("attachments").remove([path]);
  state.postFocus = null;
  await loadData();
}
async function emptyPostsTrash(posts) {
  if (!posts.length || !confirm("تفريغ سلة منشورات المحذوفة نهائيًا؟")) return;
  for (const post of posts) {
  const { error } = await sb.from("posts").delete().eq("id", post.id).not("deleted_at", "is", null);

  if (error) {
    say("تعذّر تفريغ السلة: " + error.message, true);
    return;
  }

  const path = postStoragePath(post.image_url);
  if (path) await sb.storage.from("attachments").remove([path]);
  }
  state.postFocus = null;
  await loadData();
}
function renderPosts() {
  const list = $("list");
  list.replaceChildren();

  const all = state.posts || [];
  const dead = all.filter((p) => p.deleted_at);
  const visiblePosts = state.trash && isFull()
    ? dead
    : all.filter((p) => !p.deleted_at);

  const bar = el("div", "row");
  if (isFull()) {
    const add = el("button", "", "+ منشور جديد");
    add.addEventListener("click", () => {
      state.postForm = {};
      state.postFocus = null;
      state.trash = false;
      render();
    });
    bar.appendChild(add);

    const tr = el("button", "", state.trash ? "رجوع" : "سلة المنشورات (" + dead.length + ")");
    tr.addEventListener("click", () => {
      state.trash = !state.trash;
      state.postForm = null;
      state.postFocus = null;
      render();
    });
    bar.appendChild(tr);

    if (state.trash && dead.length) {
      const et = el("button", "danger", "تفريغ السلة");
      et.addEventListener("click", () => emptyPostsTrash(dead));
      bar.appendChild(et);
    }
  }
  if (bar.children.length) list.appendChild(bar);

  if (state.postForm) {
    const editing = state.postForm.id ? all.find((p) => p.id === state.postForm.id) : null;
    list.appendChild(renderPostForm(editing || null));
  }

  if (!visiblePosts.length) {
    list.appendChild(el("p", "center", state.trash ? "سلة المنشورات فارغة" : "لا توجد منشورات حتى الآن"));
    return;
  }

  let posts = visiblePosts;
  if (state.postFocus != null) {
    const focused = visiblePosts.find((p) => String(p.id) === String(state.postFocus));
    if (focused) posts = [focused];
  }

  posts.forEach((post) => {
    const card = el("div", "card");
    if (post.content) card.appendChild(el("p", "body", post.content));

    if (post.image_url) {
      const wrap = el("div", "post-image-wrap");
      const img = document.createElement("img");
      img.className = "post-image";
      img.src = post.image_url;
      img.alt = "صورة المنشور";
      wrap.appendChild(img);
      const dl = el("a", "btn small", "⬇️ تحميل الصورة");
      dl.href = post.image_url + (post.image_url.includes("?") ? "&" : "?") + "download=" + encodeURIComponent("post-" + post.id);
      dl.rel = "noopener noreferrer";
      wrap.appendChild(dl);
      card.appendChild(wrap);
    }

    card.appendChild(el("p", "meta", fmt(post.created_at)));

    if (isFull()) {
      const row = el("div", "row");
      if (post.deleted_at) {
        const restore = el("button", "small", "استرجاع");
        restore.addEventListener("click", () => setPostDeleted(post.id, false));
        row.appendChild(restore);
        const purge = el("button", "small danger", "حذف نهائي");
        purge.addEventListener("click", () => purgePost(post));
        row.appendChild(purge);
      } else {
        const edit = el("button", "small", "تعديل");
        edit.addEventListener("click", () => {
          state.postForm = { id: post.id };
          state.postFocus = post.id;
          state.trash = false;
          render();
        });
        const del = el("button", "small danger", "حذف");
        del.addEventListener("click", () => setPostDeleted(post.id, true));
        row.appendChild(edit);
        row.appendChild(del);
      }
      const link = el("a", "btn small", "🔗 رابط المنشور");
      link.href = postUrl(post.id);
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      row.appendChild(link);
      card.appendChild(row);
    } else {
      const link = el("a", "btn small", "🔗 عرض المنشور");
      link.href = postUrl(post.id);
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      card.appendChild(link);
    }

    list.appendChild(card);
  });
}

function render() {
  renderBotBanner();
  const tabs = $("tabs");
  tabs.replaceChildren();

  const postsBtn = el("button", "tab" + (state.active === "__posts__" ? " active" : ""), "المنشورات");
  postsBtn.addEventListener("click", () => {
    state.active = "__posts__";
    state.form = null;
    state.pform = null;
    state.postForm = null;
    state.postFocus = null;
    state.trash = false;
    state.filter = "all";
    state.qform = null;
    state.answerForm = {};
    render();
  });
  tabs.appendChild(postsBtn);
  
  state.sections.forEach((sec) => {
    const b = el("button", "tab" + (sec.id === state.active ? " active" : ""), sec.title);
    b.addEventListener("click", () => {
      state.active = sec.id; state.form = null; state.pform = null; state.postForm = null; state.postFocus = null;
      state.trash = false; state.filter = "all"; state.qform = null; state.answerForm = {};
      render();
    });
    tabs.appendChild(b);
  });
  const list = $("list");
  list.replaceChildren();

  if (state.active === "__posts__") {
    $("chips").replaceChildren();
    renderPosts();
    return;
  }
  
  const sec = state.sections.find((x) => x.id === state.active);
  if (!sec) { $("chips").replaceChildren(); return; }
  if (sec.kind === "qa") { renderQA(sec); return; }
  if (sec.kind === "links") { renderLinks(sec); return; }
  renderChips(sec);
  const inSec = state.items.filter((x) => x.section_id === sec.id);
  const dead = inSec.filter((x) => x.deleted_at);
  const live = inSec.filter((x) => !x.deleted_at && visible(sec, x));
  const isTasks = sec.kind === "tasks";
  const bar = el("div", "row");
  if (isAdmin()) {
    const add = el("button", "", "+ إضافة");
    add.addEventListener("click", () => { state.form = { id: null }; state.pform = null; state.trash = false; say(""); render(); });
    const tr = el("button", "", state.trash ? "رجوع" : "سلة المحذوفات (" + dead.length + ")");
    tr.addEventListener("click", () => { state.trash = !state.trash; state.form = null; state.pform = null; render(); });
    bar.appendChild(add);
    bar.appendChild(tr);
  }
  if (isFull() && state.trash && dead.length) {
    const et = el("button", "danger", "تفريغ السلة");
    et.addEventListener("click", () => emptyTrash(dead.map((x) => x.id)));
    bar.appendChild(et);
  }
  if (isTasks && !state.trash) {
    const pa = el("button", "", "+ عنصر شخصي");
    pa.addEventListener("click", () => { state.pform = { id: null }; state.form = null; say(""); render(); });
    bar.appendChild(pa);
  }
  if (bar.children.length) list.appendChild(bar);
  if (state.form) {
    const it = state.form.id ? state.items.find((x) => x.id === state.form.id) : null;
    list.appendChild(buildForm(sec, it));
  }
  if (state.pform && isTasks && !state.trash) {
    const p = state.pform.id ? state.personal.find((x) => x.id === state.pform.id) : null;
    list.appendChild(buildPersonalForm(p));
  }
  let entries;
  if (state.trash) {
    entries = dead.map((it) => ({ k: "c", it }));
  } else {
    entries = live.map((it) => ({ k: "c", it }));
    if (isTasks && (state.filter === "all" || state.filter === "personal")) {
      state.personal.forEach((p) => entries.push({ k: "p", p }));
    }
  }
  const dlOf = (e) => {
    const d = e.k === "c" ? e.it.deadline : e.p.deadline;
    return d ? new Date(d).getTime() : Infinity;
  };
  const doneOf = (e) => (e.k === "c" ? isDone(e.it) : e.p.done) ? 1 : 0;
  const createdOf = (e) => new Date(e.k === "c" ? e.it.created_at : e.p.created_at).getTime();
  if (isTasks) {
    entries.sort((a, b) => {
      if (doneOf(a) !== doneOf(b)) return doneOf(a) - doneOf(b);
      if (dlOf(a) !== dlOf(b)) return dlOf(a) < dlOf(b) ? -1 : 1;
      return createdOf(a) - createdOf(b);
    });
  } else {
    entries.sort((a, b) => createdOf(b) - createdOf(a));
  }
  if (!entries.length) {
    list.appendChild(el("p", "center", state.trash ? "السلة فارغة" : "لا يوجد شيء هنا حتى الآن"));
  }
  entries.forEach((e) => list.appendChild(e.k === "c" ? card(sec, e.it) : personalCard(e.p)));
}
/* الدخول والحساب */
function hideAll() {
  $("app").hidden = true;
  $("picker-box").hidden = true;
  $("courses-box").hidden = true;
  $("people-box").hidden = true;
  $("log-box").hidden = true;
  $("courses-btn").hidden = true;
  $("manage-btn").hidden = true;
  $("people-btn").hidden = true;
  $("log-btn").hidden = true;
  $("backup-btn").hidden = true;
  $("links-fab").hidden = true;
  $("links-panel").hidden = true;
}
/* تبديل الحسابات (حد أقصى حسابين على نفس الجهاز) */
const ACC_KEY = "tg_accounts";
function getAccounts() { try { return JSON.parse(localStorage.getItem(ACC_KEY) || "[]"); } catch (e) { return []; } }
function setAccounts(list) { try { localStorage.setItem(ACC_KEY, JSON.stringify(list)); } catch (e) {} }
function rememberAccount(session, firstName) {
  if (!session) return;
  const list = getAccounts().filter((a) => a.id !== session.user.id);
  list.unshift({
    id: session.user.id, first_name: firstName || "",
    access_token: session.access_token, refresh_token: session.refresh_token,
  });
  setAccounts(list.slice(0, 2));
}
function syncAccountTokens(session) {
  if (!session) return;
  const list = getAccounts();
  const a = list.find((x) => x.id === session.user.id);
  if (a) { a.access_token = session.access_token; a.refresh_token = session.refresh_token; setAccounts(list); }
}
function forgetAccount(id) { setAccounts(getAccounts().filter((a) => a.id !== id)); renderSavedAccounts(); }
async function switchAccount(a) {
  showLoading(true);
  const { error } = await sb.auth.setSession({ access_token: a.access_token, refresh_token: a.refresh_token });
  if (error) { showLoading(false); forgetAccount(a.id); say("انتهت صلاحية الجلسة، برجاء تسجيل الدخول من جديد"); return; }
  await showProfile();
}
function renderSavedAccounts() {
  const box = $("saved-accounts");
  if (!box) return;
  box.replaceChildren();
  $("login-label").textContent = "الدخول بتيليجرام";
  $("login-label").hidden = false;
  $("tg-slot").hidden = false;
}
sb.auth.onAuthStateChange((_e, session) => syncAccountTokens(session));
async function showProfile() {
  showLoading(true);
  hideAll();
  $("login-box").hidden = true;
  $("pending-box").hidden = true;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    showLoading(false);
    $("logout").hidden = true;
    $("login-box").hidden = false;
    renderSavedAccounts();
    mountTelegramRedirectButton();
    return;
  }
  state.userId = session.user.id;
  $("logout").hidden = false;
  const { data, error } = await sb.from("profiles")
    .select("first_name, role, approved, courses_chosen, bot_ok").eq("id", state.userId).single();
  if (error || !data) { showLoading(false); say("تعذّر تحميل الحساب", true); return; }
  rememberAccount(session, data.first_name);
  state.role = data.role;
  state.chosen = !!data.courses_chosen;
  state.botOk = data.bot_ok;
  if (!data.approved) {
    showLoading(false);
    $("welcome").textContent = "أهلًا " + (data.first_name || "");
    $("pending-box").hidden = false;
    return;
  }
  $("hello").textContent = "WELCOME " + (data.first_name || "") + " / " + (roleLabels[data.role] || data.role);
  say("");
  const [okC, okD] = await Promise.all([loadCourses(), fetchData()]);
  showLoading(false);
  if (!okC || !okD) return;
  $("courses-btn").hidden = false;
  $("links-fab").hidden = false;
  $("manage-btn").hidden = !isAdmin();
  $("log-btn").hidden = !isAdmin();
  $("people-btn").hidden = !isFull();
  $("backup-btn").hidden = true;
  if (isFull()) {
    sb.rpc("can_backup").then(({ data }) => { $("backup-btn").hidden = data !== true; });
  }
  if (!state.chosen && state.courses.some((c) => c.is_active)) setView("picker");
  else setView("app");
}
async function onTelegramAuth(user) {
  $("login-box").hidden = true;
  showLoading(true);
  say("");
  const fail = (m) => { showLoading(false); $("login-box").hidden = false; renderSavedAccounts(); mountTelegramRedirectButton(); say(m); };
  const { data, error } = await sb.functions.invoke("telegram-auth", { body: user });
  if (error || !data || !data.token_hash) { fail("فشل الدخول، برجاء إعادة المحاولة"); return; }
  const { error: e2 } = await sb.auth.verifyOtp({ token_hash: data.token_hash, type: "magiclink" });
  if (e2) { fail("فشل إكمال الدخول"); return; }
  await showProfile();
}
/* البتاعة العائمة: جروبات التواصل بتاعة كل مادة */

    { key: "teams_link", icon: '<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#5059C9"/><text x="12" y="17" font-size="14" font-family="Arial,sans-serif" font-weight="700" fill="#fff" text-anchor="middle">T</text></svg>' },
    { key: "telegram_link", icon: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#229ED9"/><path fill="#fff" d="M17.5 7.2l-2.1 10.1c-.2.7-.6.9-1.2.6l-3.3-2.4-1.6 1.5c-.2.2-.3.3-.6.3l.2-3.3 6-5.4c.3-.2-.1-.4-.4-.2l-7.4 4.7-3.2-1c-.7-.2-.7-.7.1-1l12.5-4.8c.5-.2 1 .1.8 1z"/></svg>' },
  ];
  const list = state.courses
    .filter((c) => c.is_active)
    .map((c) => ({ c, n: kinds.reduce((s, k) => s + (c[k.key] ? 1 : 0), 0) }))
    .sort((a, b) => b.n - a.n);
  if (!list.length) { panel.appendChild(el("p", "center", "لا توجد مواد بعد")); return; }
  list.forEach(({ c }) => {
    const row = el("div", "links-row");
    row.appendChild(el("span", "name", c.name));
    const icons = el("div", "icons");
    kinds.forEach((k) => {
      if (c[k.key]) {
        const a = document.createElement("a");
        a.href = c[k.key]; a.target = "_blank"; a.rel = "noopener";
        a.innerHTML = k.icon;
        icons.appendChild(a);
      } else {
        const s = el("span", "dim");
        s.innerHTML = k.icon;
        icons.appendChild(s);
      }
    });
    row.appendChild(icons);
    panel.appendChild(row);
  });
}

$("manage-btn").addEventListener("click", () => setView("courses"));
$("people-btn").addEventListener("click", () => setView("people"));
$("log-btn").addEventListener("click", () => { state.logLimit = 100; setView("log"); });
$("backup-btn").addEventListener("click", downloadBackup);
$("logout").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
/* دخول تيليجرام على الآيفون: بيرجع للصفحة برابط فيه بيانات الدخول */
function mountTelegramRedirectButton() {
  if (!window.IS_IOS) return;
  var slot = $("tg-slot");
  if (!slot || slot.firstChild) return;
  var s = document.createElement("script");
  s.async = true;
  s.src = "https://telegram.org/js/telegram-widget.js?22";
  s.setAttribute("data-telegram-login", "MATHDEPARTMENT_BOT");
  s.setAttribute("data-size", "large");
  s.setAttribute("data-request-access", "write");
  s.setAttribute("data-auth-url", location.origin + location.pathname.replace(/index\.html$/, ""));
  slot.appendChild(s);
}
function readTelegramReturn() {
  try {
    var q = new URLSearchParams(location.search);
    if (!q.get("hash") || !q.get("id") || !q.get("auth_date")) return null;
    var keys = ["id", "first_name", "last_name", "username", "photo_url", "auth_date", "hash"];
    var u = {};
    keys.forEach(function (k) { if (q.has(k)) u[k] = q.get(k); });
    history.replaceState(null, "", location.pathname);
    return u;
  } catch (e) { return null; }
}
var tgReturn = readTelegramReturn();
if (tgReturn) onTelegramAuth(tgReturn); else showProfile();
